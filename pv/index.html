<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花骨朵 PV</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #08080a; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; display: grid; place-items: center; min-height: 0; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #111; }
  #bar input[type=range] { flex: 1; }
  #bar button { background: #2a2a2e; color: #eee; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  body.render #bar { display: none; }
  body.render canvas { max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="pv" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="play">播放</button>
    <input id="seek" type="range" min="0" max="170.4" step="0.0166667" value="0">
    <span id="time">0.00</span>
  </div>
</div>
<audio id="audio" src="build/song.wav" preload="auto"></audio>
<script type="module">
  import { boot } from './src/main.js';
  const params = new URLSearchParams(location.search);
  if (params.has('render')) document.body.classList.add('render');
  const pv = await boot(document.getElementById('pv'));
  window.PV = pv;
  window.PV_READY = true;
  if (!params.has('render')) {
    // interactive preview: scrub, or play along with the soundtrack
    const seek = document.getElementById('seek');
    const label = document.getElementById('time');
    const audio = document.getElementById('audio');
    const btn = document.getElementById('play');
    seek.max = pv.duration;
    let busy = false;
    const show = async (t) => {
      if (busy) return;
      busy = true;
      await pv.renderFrame(t);
      label.textContent = t.toFixed(2);
      busy = false;
    };
    seek.addEventListener('input', () => show(+seek.value));
    btn.addEventListener('click', () => {
      if (audio.paused) {
        audio.currentTime = +seek.value;
        audio.play();
        btn.textContent = '暂停';
        const loop = async () => {
          if (audio.paused) return;
          seek.value = audio.currentTime;
          await show(audio.currentTime);
          requestAnimationFrame(loop);
        };
        loop();
      } else {
        audio.pause();
        btn.textContent = '播放';
      }
    });
    show(+(params.get('t') ?? 0));
  }
</script>
</body>
</html>
